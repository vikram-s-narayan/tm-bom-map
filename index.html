<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TM-BOM Metro Map — CycloneDX 2.0</title>
<link rel="icon" href="data:,">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f4f3ee;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  #header {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: #2b2b3d;
    color: #fff;
    padding: 12px 24px;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }

  #header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  #header .subtitle {
    font-size: 12px;
    color: #aaa;
    margin-left: auto;
  }

  .legend {
    display: flex;
    gap: 14px;
    margin-left: 32px;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: #ccc;
    cursor: pointer;
    padding: 4px 10px;
    border-radius: 4px;
    transition: background 0.2s, color 0.2s;
    user-select: none;
  }

  .legend-item:hover {
    background: rgba(255,255,255,0.12);
    color: #fff;
  }

  .legend-item.active {
    background: rgba(255,255,255,0.2);
    color: #fff;
    font-weight: 600;
  }

  .legend-swatch {
    width: 20px;
    height: 5px;
    border-radius: 3px;
  }

  #map-group polyline:not(#route-trail),
  #map-group rect,
  .station-dot,
  .hub-circle,
  .station-label {
    transition: opacity 0.35s ease;
  }

  #map-container {
    width: 100vw;
    height: 100vh;
    padding-top: 52px;
    cursor: grab;
    overflow: hidden;
  }

  #map-container.grabbing { cursor: grabbing; }

  svg {
    display: block;
  }

  /* Metro line styles */
  .line-purple { stroke: #3b2d8e; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-orange { stroke: #d4721a; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-red    { stroke: #b7472a; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-gray   { stroke: #6b6b6b; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-green  { stroke: #27ae60; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-teal   { stroke: #16a085; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-cyan   { stroke: #2980b9; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-sienna { stroke: #A0522D; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .line-gold   { stroke: #9B7B2C; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  /* Station styles */
  .station-dot {
    cursor: pointer;
  }

  .station-dot .hit-area {
    fill: transparent;
    stroke: none;
  }

  .station-label {
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    font-size: 13px;
    font-weight: 600;
    pointer-events: none;
    user-select: none;
  }

  .label-purple { fill: #3b2d8e; }
  .label-orange { fill: #d4721a; }
  .label-red    { fill: #b7472a; }
  .label-gray   { fill: #555; }
  .label-green  { fill: #27ae60; }
  .label-teal   { fill: #16a085; }
  .label-cyan   { fill: #2980b9; }
  .label-sienna { fill: #A0522D; }
  .label-gold  { fill: #9B7B2C; }

  .hub-circle {
    cursor: pointer;
  }

  .hub-circle .hit-area {
    fill: transparent;
    stroke: none;
  }

  /* Tooltip */
  #tooltip {
    position: fixed;
    background: #2b2b3d;
    color: #fff;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
    max-width: 380px;
    pointer-events: none;
    display: none;
    z-index: 200;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  #tooltip.visible { display: block; }

  #tooltip .tt-title {
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 4px;
    border-bottom: 2px solid;
    padding-bottom: 4px;
  }

  #tooltip .tt-line {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 6px;
  }

  #tooltip .tt-props {
    font-size: 12px;
    color: #ccc;
  }

  #tooltip .tt-props span {
    color: #ffd;
    font-weight: 600;
  }

  /* Zoom controls */
  #controls {
    position: fixed;
    bottom: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    z-index: 100;
  }

  #controls button {
    width: 36px;
    height: 36px;
    border: none;
    background: #2b2b3d;
    color: #fff;
    font-size: 18px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #controls button:hover { background: #444; }

  /* Route animation */
  #route-btn { font-size: 11px; width: auto; padding: 0 10px; letter-spacing: 0.3px; }

  @keyframes station-pulse {
    0%   { transform: scale(1); opacity: 1; }
    40%  { transform: scale(1.9); opacity: 0.85; }
    100% { transform: scale(1); opacity: 1; }
  }

  .station-active > circle:not(.hit-area),
  .station-active > circle:nth-child(2) {
    animation: station-pulse 0.8s ease-in-out;
    transform-origin: center;
    transform-box: fill-box;
  }

  .station-visited > circle:not(.hit-area) {
    stroke-width: 4;
  }

  #phase-banner {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(180deg, rgba(43,43,61,0.0) 0%, rgba(43,43,61,0.95) 30%);
    padding: 32px 32px 18px;
    z-index: 150;
    display: none;
    align-items: flex-end;
    gap: 20px;
    color: #fff;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  }

  #phase-banner.visible { display: flex; }

  .phase-number {
    font-size: 36px;
    font-weight: 800;
    line-height: 1;
    min-width: 50px;
  }

  .phase-info {
    flex: 1;
  }

  .phase-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 2px;
  }

  .phase-desc {
    font-size: 13px;
    color: #aab;
  }

  .phase-dots {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .phase-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #555;
    transition: background 0.3s, transform 0.3s;
  }

  .phase-dot.completed { background: #7f8; }
  .phase-dot.current { background: #fff; transform: scale(1.4); }

  .phase-advance {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    padding: 8px 18px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }

  .phase-advance:hover { background: rgba(255,255,255,0.25); }

  /* Edit mode — draggable stations */
  .edit-mode .station-dot, .edit-mode .hub-circle { cursor: grab; }
  .edit-mode .station-dot.dragging, .edit-mode .hub-circle.dragging { cursor: grabbing; }
  #edit-btn { font-size: 11px; width: auto; padding: 0 10px; letter-spacing: 0.3px; }
  #edit-btn.active { background: #d4721a; color: #fff; }
  #reset-layout-btn { font-size: 11px; width: auto; padding: 0 10px; letter-spacing: 0.3px; display: none; }
  #controls.edit-mode-controls #reset-layout-btn { display: flex; }
</style>
</head>

<div id="header">
  <h1>Threat Modeling BOM — Metro Map</h1>
  <div class="legend">
    <div class="legend-item active" data-line="all">
      <div class="legend-swatch" style="background:linear-gradient(90deg,#9B7B2C,#3b2d8e,#A0522D,#d4721a,#b7472a,#6b6b6b,#27ae60,#16a085,#2980b9);"></div>

    <div class="legend-item" data-line="teal">

  <div class="subtitle">CycloneDX 2.0</div>
</div>

<div id="map-container">
  <svg id="metro-svg" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Terminal cap markers -->
      <marker id="cap-purple" markerWidth="8" markerHeight="8" refX="4" refY="4">
        <rect x="1" y="0" width="6" height="8" rx="1" fill="#3b2d8e"/>
      </marker>
      <marker id="cap-orange" markerWidth="8" markerHeight="8" refX="4" refY="4">
        <rect x="1" y="0" width="6" height="8" rx="1" fill="#d4721a"/>

      <marker id="cap-gray" markerWidth="8" markerHeight="8" refX="4" refY="4">

      <marker id="cap-red" markerWidth="8" markerHeight="8" refX="4" refY="4">

const svgElement = document.getElementById('metro-svg');
const mapGroup = document.getElementById('map-group');
const container = document.getElementById('map-container');

let viewBox = { x: -150, y: 60, w: 1700, h: 1100 };
let isPanning = false;
let panStart = { x: 0, y: 0 };
let viewBoxStart = { x: 0, y: 0 };

function applyViewBox() {
  svgElement.setAttribute('viewBox', `${viewBox.x} ${viewBox.y} ${viewBox.w} ${viewBox.h}`);
}

function resizeSvg() {
  svgElement.setAttribute('width', window.innerWidth);
  svgElement.setAttribute('height', window.innerHeight - 52);
  applyViewBox();
}

window.addEventListener('resize', resizeSvg);
resizeSvg();

container.addEventListener('mousedown', (e) => {
  if (e.target.closest('.station-dot, .hub-circle')) return;
  isPanning = true;
  container.classList.add('grabbing');
  panStart = { x: e.clientX, y: e.clientY };
  viewBoxStart = { x: viewBox.x, y: viewBox.y };
});

window.addEventListener('mousemove', (e) => {
  if (!isPanning) return;
  const scaleFactorX = viewBox.w / svgElement.clientWidth;
  const scaleFactorY = viewBox.h / svgElement.clientHeight;
  viewBox.x = viewBoxStart.x - (e.clientX - panStart.x) * scaleFactorX;
  viewBox.y = viewBoxStart.y - (e.clientY - panStart.y) * scaleFactorY;
  applyViewBox();
});

window.addEventListener('mouseup', () => {
  isPanning = false;
  container.classList.remove('grabbing');
});

container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomFactor = e.deltaY > 0 ? 1.08 : 0.92;
  const rect = svgElement.getBoundingClientRect();
  const mouseXRatio = (e.clientX - rect.left) / rect.width;
  const mouseYRatio = (e.clientY - rect.top) / rect.height;

  const newW = viewBox.w * zoomFactor;
  const newH = viewBox.h * zoomFactor;

  viewBox.x += (viewBox.w - newW) * mouseXRatio;
  viewBox.y += (viewBox.h - newH) * mouseYRatio;
  viewBox.w = newW;
  viewBox.h = newH;
  applyViewBox();
}, { passive: false });

document.getElementById('zoom-in').addEventListener('click', () => {
  const zoomFactor = 0.85;
  const centerX = viewBox.x + viewBox.w / 2;
  const centerY = viewBox.y + viewBox.h / 2;
  viewBox.w *= zoomFactor;
  viewBox.h *= zoomFactor;
  viewBox.x = centerX - viewBox.w / 2;
  viewBox.y = centerY - viewBox.h / 2;
  applyViewBox();
});

document.getElementById('zoom-out').addEventListener('click', () => {
  const zoomFactor = 1.18;
  const centerX = viewBox.x + viewBox.w / 2;
  const centerY = viewBox.y + viewBox.h / 2;
  viewBox.w *= zoomFactor;
  viewBox.h *= zoomFactor;
  viewBox.x = centerX - viewBox.w / 2;
  viewBox.y = centerY - viewBox.h / 2;
  applyViewBox();
});

document.getElementById('zoom-reset').addEventListener('click', () => {
  viewBox = { x: -50, y: 60, w: 1600, h: 1100 };
  applyViewBox();
});

function showTooltip(stationInfo, e) {
  if (mapGroup.classList.contains('edit-mode')) return;
  clearTimeout(hideTimer);
  activeStation = stationInfo;

  tooltip.querySelector('.tt-line').textContent = stationInfo.line;
  tooltip.querySelector('.tt-line').style.color = stationInfo.color;
  tooltip.querySelector('.tt-title').textContent = stationInfo.title;
  tooltip.querySelector('.tt-title').style.borderColor = stationInfo.color;
  let tooltipContent = stationInfo.desc + '<br><br><span>Schema props:</span> ' + stationInfo.props.join(', ');
  if (stationInfo.example) {
    tooltipContent += '<br><br><span>Example:</span> ' + stationInfo.example;
  }
  tooltip.querySelector('.tt-props').innerHTML = tooltipContent;

  positionTooltip(e);
  tooltip.classList.add('visible');
}

function positionTooltip(e) {
  const tooltipWidth = 380;
  const offset = 20;
  let leftPosition = e.clientX + offset;
  if (leftPosition + tooltipWidth > window.innerWidth) {
    leftPosition = e.clientX - tooltipWidth - offset;
  }
  let topPosition = e.clientY + offset;
  if (topPosition + 200 > window.innerHeight) {
    topPosition = e.clientY - 200;
  }
  tooltip.style.left = leftPosition + 'px';
  tooltip.style.top = topPosition + 'px';
}

function scheduleHide() {
  hideTimer = setTimeout(() => {
    tooltip.classList.remove('visible');
    activeStation = null;
  }, 120);
}

});

const routeOverlay = document.getElementById('route-overlay');
const trainDot = document.getElementById('train-dot');
const trainGlowRing = document.getElementById('train-glow-ring');
const routeTrail = document.getElementById('route-trail');
const phaseBanner = document.getElementById('phase-banner');
const phaseNumDisplay = document.getElementById('phase-num');
const phaseTitleDisplay = document.getElementById('phase-title');
const phaseDescDisplay = document.getElementById('phase-desc');
const phaseDotsContainer = document.getElementById('phase-dots');
const phaseNextBtn = document.getElementById('phase-next');
const routeBtn = document.getElementById('route-btn');

let routeActive = false;
let currentPhaseIndex = -1;
let animationFrameId = null;
let trailPoints = [];
let waitingForAdvance = false;
let branchIndex = -1;
let steppingBranches = false;

function setTrainPosition(positionX, positionY) {
  trainDot.setAttribute('cx', positionX);
  trainDot.setAttribute('cy', positionY);
  trainGlowRing.setAttribute('cx', positionX);
  trainGlowRing.setAttribute('cy', positionY);
}

function setTrainColor(lineColor) {
  trainDot.setAttribute('fill', lineColor);
  trainGlowRing.setAttribute('stroke', lineColor);
  routeTrail.setAttribute('stroke', lineColor);
}

function addTrailPoint(trailX, trailY) {
  trailPoints.push(`${trailX},${trailY}`);
  routeTrail.setAttribute('points', trailPoints.join(' '));
}

function updatePhaseDots(activePhaseIndex) {
  const phaseDotElements = phaseDotsContainer.querySelectorAll('.phase-dot');
  phaseDotElements.forEach((dotElement, dotIndex) => {
    dotElement.className = 'phase-dot';
    if (dotIndex < activePhaseIndex) dotElement.classList.add('completed');
    if (dotIndex === activePhaseIndex) dotElement.classList.add('current');
  });
}

function visitBranchStation(stationId) {
  const stationElement = document.querySelector(`[data-station="${stationId}"]`);
  if (!stationElement) return;
  stationElement.classList.add('station-active');
  stationElement.classList.add('station-visited');
  setTimeout(() => stationElement.classList.remove('station-active'), 900);
}

function updateBranchDisplay(phaseData) {
  const total = phaseData.branchStations.length;
  if (branchIndex < total) {
    const stationId = phaseData.branchStations[branchIndex];
    const stationInfo = stationData[stationId];
    const stationLabel = stationInfo ? stationInfo.title : stationId;
    phaseDescDisplay.textContent = `${branchIndex + 1}/${total} — ${stationLabel}`;
    phaseNextBtn.textContent = branchIndex < total - 1 ? 'Next →' : 'Continue →';
  }
}

function markMainStationVisited(positionX, positionY) {
  document.querySelectorAll('.station-dot, .hub-circle').forEach(stationElement => {
    const circleElement = stationElement.querySelector('circle:not(.hit-area)');
    if (!circleElement) return;
    const circleX = parseFloat(circleElement.getAttribute('cx'));
    const circleY = parseFloat(circleElement.getAttribute('cy'));
    if (Math.abs(circleX - positionX) < 5 && Math.abs(circleY - positionY) < 5) {
      stationElement.classList.add('station-visited');
    }
  });
}

function animateAlongWaypoints(waypointList, segmentSpeed, completionCallback) {
  if (waypointList.length < 2) {
    if (waypointList.length === 1) {
      setTrainPosition(waypointList[0][0], waypointList[0][1]);
      addTrailPoint(waypointList[0][0], waypointList[0][1]);
      markMainStationVisited(waypointList[0][0], waypointList[0][1]);
    }
    completionCallback();
    return;
  }

  let currentSegmentIndex = 0;
  let segmentProgress = 0;

  function moveNextSegment() {
    if (currentSegmentIndex >= waypointList.length - 1) {
      completionCallback();
      return;
    }

    const startPoint = waypointList[currentSegmentIndex];
    const endPoint = waypointList[currentSegmentIndex + 1];
    const segmentDeltaX = endPoint[0] - startPoint[0];
    const segmentDeltaY = endPoint[1] - startPoint[1];
    const segmentLength = Math.sqrt(segmentDeltaX * segmentDeltaX + segmentDeltaY * segmentDeltaY);
    const segmentDurationMs = (segmentLength / segmentSpeed) * 1000;
    let segmentStartTime = null;

    addTrailPoint(startPoint[0], startPoint[1]);
    markMainStationVisited(startPoint[0], startPoint[1]);

    function animateFrame(frameTimestamp) {
      if (!routeActive) return;
      if (!segmentStartTime) segmentStartTime = frameTimestamp;
      segmentProgress = Math.min((frameTimestamp - segmentStartTime) / segmentDurationMs, 1);

      const currentX = startPoint[0] + segmentDeltaX * segmentProgress;
      const currentY = startPoint[1] + segmentDeltaY * segmentProgress;
      setTrainPosition(currentX, currentY);

      if (segmentProgress < 1) {
        animationFrameId = requestAnimationFrame(animateFrame);
      } else {
        addTrailPoint(endPoint[0], endPoint[1]);
        markMainStationVisited(endPoint[0], endPoint[1]);
        currentSegmentIndex++;
        moveNextSegment();
      }
    }

    animationFrameId = requestAnimationFrame(animateFrame);
  }

  moveNextSegment();
}

function showPhase(phaseIndex) {
  const phaseData = routePhases[phaseIndex];
  currentPhaseIndex = phaseIndex;

  phaseNumDisplay.textContent = phaseData.phaseNumber;
  phaseNumDisplay.style.color = phaseData.color;
  phaseTitleDisplay.textContent = phaseData.title;
  phaseDescDisplay.textContent = phaseData.desc;
  updatePhaseDots(phaseIndex);
  setTrainColor(phaseData.color);

  if (phaseIndex === routePhases.length - 1) {
    phaseNextBtn.textContent = 'Done ✓';
  } else {
    phaseNextBtn.textContent = 'Next →';
  }

  animateAlongWaypoints(phaseData.waypoints, 150, () => {
    if (phaseData.branchStations.length > 0) {
      steppingBranches = true;
      branchIndex = 0;
      visitBranchStation(phaseData.branchStations[0]);
      updateBranchDisplay(phaseData);
    } else {
      phaseNextBtn.textContent = currentPhaseIndex >= routePhases.length - 1 ? 'Done ✓' : 'Next →';
    }
    waitingForAdvance = true;
  });
}

function advancePhase() {
  if (!routeActive || !waitingForAdvance) return;

  const phaseData = routePhases[currentPhaseIndex];

  if (steppingBranches && branchIndex < phaseData.branchStations.length - 1) {
    branchIndex++;
    visitBranchStation(phaseData.branchStations[branchIndex]);
    updateBranchDisplay(phaseData);
    return;
  }

  steppingBranches = false;
  branchIndex = -1;
  waitingForAdvance = false;

  if (currentPhaseIndex >= routePhases.length - 1) {
    resetRoute();
    return;
  }

  showPhase(currentPhaseIndex + 1);
}

function startRoute() {
  if (activeLineFilter) applyLineFilter(activeLineFilter);
  routeActive = true;
  trailPoints = [];
  routeTrail.setAttribute('points', '');
  routeOverlay.style.display = '';
  phaseBanner.classList.add('visible');
  routeBtn.textContent = '■ Stop';

  document.querySelectorAll('.station-dot, .hub-circle').forEach(stationElement => {
    stationElement.classList.remove('station-active', 'station-visited');
  });

  showPhase(0);
}

function resetRoute() {
  routeActive = false;
  waitingForAdvance = false;
  steppingBranches = false;
  branchIndex = -1;
  currentPhaseIndex = -1;

  if (animationFrameId) {
    cancelAnimationFrame(animationFrameId);
    animationFrameId = null;
  }

  routeOverlay.style.display = 'none';
  phaseBanner.classList.remove('visible');
  routeBtn.textContent = '▶ Route';

  trailPoints = [];
  routeTrail.setAttribute('points', '');

  document.querySelectorAll('.station-dot, .hub-circle').forEach(stationElement => {
    stationElement.classList.remove('station-active', 'station-visited');
  });
}

routeBtn.addEventListener('click', () => {
  if (routeActive) {
    resetRoute();
  } else {
    startRoute();
  }
});

phaseNextBtn.addEventListener('click', advancePhase);

document.addEventListener('keydown', (keyEvent) => {
  if (!routeActive) return;
  if (keyEvent.key === 'ArrowRight' || keyEvent.key === ' ') {
    keyEvent.preventDefault();
    advancePhase();
  }
  if (keyEvent.key === 'r' || keyEvent.key === 'R' || keyEvent.key === 'Escape') {
    resetRoute();
  }
});

// ─── Draggable Stations (Edit Mode) ──────────────────
const stationPositions = {};
const stationLinks = {};
let editModeActive = false;
let dragTarget = null;
let dragStationKey = null;
let dragStartSvgPoint = null;
let dragStartStationPos = null;

const editBtn = document.getElementById('edit-btn');
const resetLayoutBtn = document.getElementById('reset-layout-btn');
const controlsDiv = document.getElementById('controls');

function clientToSvgPoint(clientX, clientY) {
  const svgPoint = svgElement.createSVGPoint();
  svgPoint.x = clientX;
  svgPoint.y = clientY;
  return svgPoint.matrixTransform(svgElement.getScreenCTM().inverse());
}

function buildRegistry() {
  const allLabels = Array.from(document.querySelectorAll('.station-label'));
  const allPolylines = Array.from(mapGroup.querySelectorAll('polyline:not(#route-trail)'));
  const allTerminalRects = Array.from(mapGroup.querySelectorAll('rect'));

  document.querySelectorAll('.station-dot, .hub-circle').forEach(stationElement => {
    const stationKey = stationElement.dataset.station;
    const firstCircle = stationElement.querySelector('circle');
    const stationX = parseFloat(firstCircle.getAttribute('cx'));
    const stationY = parseFloat(firstCircle.getAttribute('cy'));

    stationPositions[stationKey] = { x: stationX, y: stationY };

    // Find nearest label
    let nearestLabel = null;
    let nearestDistance = Infinity;
    allLabels.forEach(labelElement => {
      const labelX = parseFloat(labelElement.getAttribute('x'));
      const labelY = parseFloat(labelElement.getAttribute('y'));
      const distance = Math.hypot(labelX - stationX, labelY - stationY);
      if (distance < nearestDistance) {
        nearestDistance = distance;
        nearestLabel = labelElement;
      }
    });

    let labelOffset = null;
    if (nearestLabel && nearestDistance < 80) {
      labelOffset = {
        dx: parseFloat(nearestLabel.getAttribute('x')) - stationX,
        dy: parseFloat(nearestLabel.getAttribute('y')) - stationY
      };
    } else {
      nearestLabel = null;
    }

    // Find matching polyline points
    const polylineMatches = [];
    allPolylines.forEach(polyline => {
      const pointPairs = polyline.getAttribute('points').trim().split(/\s+/);
      pointPairs.forEach((pair, pointIndex) => {
        const [pointX, pointY] = pair.split(',').map(Number);
        if (Math.abs(pointX - stationX) <= 3 && Math.abs(pointY - stationY) <= 3) {
          polylineMatches.push({ polyline, pointIndex });
        }
      });
    });

    // Find matching terminal caps
    const terminalCapMatches = [];
    allTerminalRects.forEach(rect => {
      const rectX = parseFloat(rect.getAttribute('x'));
      const rectY = parseFloat(rect.getAttribute('y'));
      const rectWidth = parseFloat(rect.getAttribute('width'));
      const rectHeight = parseFloat(rect.getAttribute('height'));
      const centerX = rectX + rectWidth / 2;
      const centerY = rectY + rectHeight / 2;
      if (Math.abs(centerX - stationX) <= 15 && Math.abs(centerY - stationY) <= 15) {
        terminalCapMatches.push(rect);
      }
    });

    stationLinks[stationKey] = {
      element: stationElement,
      label: nearestLabel,
      labelOffset,
      polylinePoints: polylineMatches,
      terminalCaps: terminalCapMatches
    };
  });
}

function moveStation(stationKey, newX, newY) {
  const oldPosition = stationPositions[stationKey];
  const deltaX = newX - oldPosition.x;
  const deltaY = newY - oldPosition.y;

  stationPositions[stationKey] = { x: newX, y: newY };

  // Update all circles in the station group
  const stationElement = stationLinks[stationKey].element;
  stationElement.querySelectorAll('circle').forEach(circle => {
    circle.setAttribute('cx', parseFloat(circle.getAttribute('cx')) + deltaX);
    circle.setAttribute('cy', parseFloat(circle.getAttribute('cy')) + deltaY);
  });

  // Update linked label (preserve offset)
  const { label, labelOffset } = stationLinks[stationKey];
  if (label && labelOffset) {
    label.setAttribute('x', newX + labelOffset.dx);
    label.setAttribute('y', newY + labelOffset.dy);
    label.querySelectorAll('tspan').forEach(tspan => {
      if (tspan.hasAttribute('x')) {
        tspan.setAttribute('x', parseFloat(tspan.getAttribute('x')) + deltaX);
      }
    });
  }

  // Update polyline points at matching indices
  stationLinks[stationKey].polylinePoints.forEach(({ polyline, pointIndex }) => {
    const pointPairs = polyline.getAttribute('points').trim().split(/\s+/);
    pointPairs[pointIndex] = `${newX},${newY}`;
    polyline.setAttribute('points', pointPairs.join(' '));
  });

  // Update terminal cap positions
  stationLinks[stationKey].terminalCaps.forEach(rect => {
    rect.setAttribute('x', parseFloat(rect.getAttribute('x')) + deltaX);
    rect.setAttribute('y', parseFloat(rect.getAttribute('y')) + deltaY);
  });

  // Update route animation waypoints
  routePhases.forEach(phase => {
    phase.waypoints.forEach(waypoint => {
      if (Math.abs(waypoint[0] - oldPosition.x) <= 3 && Math.abs(waypoint[1] - oldPosition.y) <= 3) {
        waypoint[0] = newX;
        waypoint[1] = newY;
      }
    });
  });
}

function saveLayout() {
  localStorage.setItem('tm-bom-layout', JSON.stringify(stationPositions));
}

function resetLayout() {
  localStorage.removeItem('tm-bom-layout');
  location.reload();
}

// Build registry from original DOM, then apply any saved layout
buildRegistry();

(function applySavedLayout() {
  const savedLayoutData = localStorage.getItem('tm-bom-layout');
  if (!savedLayoutData) return;
  const savedPositions = JSON.parse(savedLayoutData);
  Object.keys(savedPositions).forEach(stationKey => {
    if (stationPositions[stationKey]) {
      moveStation(stationKey, savedPositions[stationKey].x, savedPositions[stationKey].y);
    }
  });
})();

// ─── Line Filter (click legend to isolate a line) ────
const lineFilterMap = {
  purple: {
    stations: ['threatModel', 'weakness', 'vulnerabilities', 'capec', 'killChain', 'indicators'],
    hubs: ['blueprint', 'threat']
  },
  sienna: {
    stations: ['threatOrigin', 'originAdversarial', 'originAccidental', 'originStructural', 'originEnvironmental'],
    hubs: ['threat']
  },
  cyan: {
    stations: ['assumptions', 'assets', 'dataStores', 'dataSets', 'relationships', 'zones', 'boundaries', 'flows', 'useCases', 'behaviors', 'blueprintActors'],
    hubs: ['blueprint']
  },
  orange: {
    stations: ['actor', 'threatProfile', 'attackVector', 'exploitability', 'attackTrees', 'abuseCases', 'attackPaths', 'trustBoundaries'],
    hubs: ['threat', 'threatScenario']
  },
  red: {
    stations: ['methodologies', 'likelihood', 'impact', 'riskScore', 'affectedAssets'],
    hubs: ['threatScenario']
  },
  gray: {
    stations: ['inherentRisk', 'residualRisk', 'targetRisk', 'riskResponse', 'assessment', 'riskAppetite'],
    hubs: ['threatScenario', 'risk']
  },
  green: {
    stations: ['effectiveness', 'appliesTo', 'implementedBy'],
    hubs: ['risk', 'control']
  },
  teal: {
    stations: ['satisfies', 'requirements', 'acceptanceCriteria'],
    hubs: ['control']
  },
  gold: {
    stations: ['businessObjectives'],
    hubs: []
  }
};

const lineColorHexMap = {
  purple: '#3b2d8e', sienna: '#A0522D', cyan: '#2980b9',
  orange: '#d4721a', red: '#b7472a', gray: '#6b6b6b', green: '#27ae60', teal: '#16a085',
  gold: '#9B7B2C'
};

let activeLineFilter = null;

function applyLineFilter(lineKey) {
  activeLineFilter = (activeLineFilter === lineKey) ? null : lineKey;

  document.querySelectorAll('.legend-item[data-line]').forEach(legendItem => {
    if (legendItem.dataset.line === 'all') {
      legendItem.classList.toggle('active', !activeLineFilter);
    } else {
      legendItem.classList.toggle('active', legendItem.dataset.line === activeLineFilter);
    }
  });

  const dimOpacity = '0.06';

  if (!activeLineFilter) {
    mapGroup.querySelectorAll('polyline:not(#route-trail)').forEach(el => { el.style.opacity = ''; });
    mapGroup.querySelectorAll('rect').forEach(el => { el.style.opacity = ''; });
    document.querySelectorAll('.station-dot, .hub-circle').forEach(el => {
      el.style.opacity = '';
      el.style.pointerEvents = '';
    });
    document.querySelectorAll('.station-label').forEach(el => { el.style.opacity = ''; });
    return;
  }

  const filterDefinition = lineFilterMap[activeLineFilter];
  const visibleStationKeys = new Set([...filterDefinition.stations, ...filterDefinition.hubs]);
  const activeCssClass = 'line-' + activeLineFilter;
  const activeHexColor = lineColorHexMap[activeLineFilter];

  mapGroup.querySelectorAll('polyline:not(#route-trail)').forEach(el => {
    el.style.opacity = el.classList.contains(activeCssClass) ? '' : dimOpacity;
  });

  mapGroup.querySelectorAll('rect').forEach(el => {
    el.style.opacity = el.getAttribute('fill') === activeHexColor ? '' : dimOpacity;
  });

  document.querySelectorAll('.station-dot, .hub-circle').forEach(el => {
    const isVisible = visibleStationKeys.has(el.dataset.station);
    el.style.opacity = isVisible ? '' : dimOpacity;
    el.style.pointerEvents = isVisible ? '' : 'none';
  });

  const visibleLabelElements = new Set();
  visibleStationKeys.forEach(stationKey => {
    if (stationLinks[stationKey] && stationLinks[stationKey].label) {
      visibleLabelElements.add(stationLinks[stationKey].label);
    }
  });
  document.querySelectorAll('.station-label').forEach(el => {
    el.style.opacity = visibleLabelElements.has(el) ? '' : dimOpacity;
  });
}

document.querySelectorAll('.legend-item[data-line]').forEach(legendItem => {
  legendItem.addEventListener('click', () => {
    if (routeActive) return;
    if (legendItem.dataset.line === 'all') {
      if (activeLineFilter) applyLineFilter(activeLineFilter);
    } else {
      applyLineFilter(legendItem.dataset.line);
    }
  });
});

// Edit mode toggle
editBtn.addEventListener('click', () => {
  editModeActive = !editModeActive;
  if (editModeActive) {
    editBtn.textContent = '✎ Done';
    editBtn.classList.add('active');
    controlsDiv.classList.add('edit-mode-controls');
    mapGroup.classList.add('edit-mode');
    if (routeActive) resetRoute();
    if (activeLineFilter) applyLineFilter(activeLineFilter);
    routeBtn.disabled = true;
    routeBtn.style.opacity = '0.4';
  } else {
    editBtn.textContent = '✎ Edit';
    editBtn.classList.remove('active');
    controlsDiv.classList.remove('edit-mode-controls');
    mapGroup.classList.remove('edit-mode');
    routeBtn.disabled = false;
    routeBtn.style.opacity = '';
  }
});

// Drag handlers
mapGroup.addEventListener('mousedown', (e) => {
  if (!editModeActive) return;
  const stationElement = e.target.closest('.station-dot, .hub-circle');
  if (!stationElement) return;

  e.preventDefault();
  e.stopPropagation();

  dragStationKey = stationElement.dataset.station;
  dragTarget = stationElement;
  dragTarget.classList.add('dragging');
  dragStartSvgPoint = clientToSvgPoint(e.clientX, e.clientY);
  dragStartStationPos = { ...stationPositions[dragStationKey] };
  container.classList.add('grabbing');
});

window.addEventListener('mousemove', (e) => {
  if (!dragTarget) return;
  const currentSvgPoint = clientToSvgPoint(e.clientX, e.clientY);
  const newX = dragStartStationPos.x + (currentSvgPoint.x - dragStartSvgPoint.x);
  const newY = dragStartStationPos.y + (currentSvgPoint.y - dragStartSvgPoint.y);
  moveStation(dragStationKey, newX, newY);
});

window.addEventListener('mouseup', () => {
  if (!dragTarget) return;
  dragTarget.classList.remove('dragging');
  container.classList.remove('grabbing');
  saveLayout();
  dragTarget = null;
  dragStationKey = null;
  dragStartSvgPoint = null;
  dragStartStationPos = null;
});

resetLayoutBtn.addEventListener('click', resetLayout);
</script>
